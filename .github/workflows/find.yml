name: find
on:
  workflow_dispatch:
    inputs:
      streamers: {description: "Twitch usernames, comma separated", required: true}
      range: {description: "24hr, 7d, 30d or all", default: "7d"}
      per_streamer: {description: "Top clips per streamer", default: "5"}
      match: {description: "Only clips whose title contains (optional, e.g. gta)", default: ""}
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q yt-dlp faster-whisper pillow
      - run: python3 tools/find.py
        env:
          STREAMERS: ${{ inputs.streamers }}
          RANGE: ${{ inputs.range }}
          PER_STREAMER: ${{ inputs.per_streamer }}
          MATCH: ${{ inputs.match }}
      - uses: actions/upload-artifact@v4
        with: {name: candidates, path: out/, retention-days: 7}

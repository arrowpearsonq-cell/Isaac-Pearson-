name: render
on:
  workflow_dispatch:
    inputs:
      jobs: {description: "JSON list of clip jobs (see tools/render_jobs.py)", required: true}
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q yt-dlp faster-whisper pillow
      - run: python3 tools/render_jobs.py
        env:
          JOBS: ${{ inputs.jobs }}
      - uses: actions/upload-artifact@v4
        with:
          name: clips
          retention-days: 14
          path: |
            out/*.mp4
            out/*.txt
      - name: Publish clips at public links (for Metricool)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "clips-${{ github.run_id }}" out/*.mp4 out/*.txt --title "Clips ${{ github.run_id }}" --notes "auto"
      - name: Save results to the results branch
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          U="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          cd /tmp
          git clone -q --depth 1 -b results "$U" r || (mkdir r && cd r && git init -q -b results && git remote add origin "$U")
          cd r && git config user.name clip-bot && git config user.email clip-bot@users.noreply.github.com
          mkdir -p "runs/${{ github.run_id }}" && cp -r "$GITHUB_WORKSPACE/out/." "runs/${{ github.run_id }}/"
          git add runs && git commit -qm "run ${{ github.run_id }}" && git push -q origin results
